name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Test and build web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      EXACT2: ${{ github.workspace }}/exact
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out Exact
        uses: actions/checkout@v4
        with:
          repository: expo/exact
          path: exact

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Exact dependencies
        working-directory: exact
        run: bun install --frozen-lockfile

      - name: Prepare Exact toolchain
        working-directory: exact
        run: bun scripts/exact.mjs setup

      - name: Validate Contract
        working-directory: app
        run: |
          bun exact.mjs contract types app.contract -o app.contract.d.ts
          bun exact.mjs contract build app.contract --json --errors-only

      - name: Run web Contract test
        working-directory: app
        run: bun exact.mjs test web app.test.contract

      - name: Build web
        working-directory: app
        run: bun exact.mjs web-build --out dist

      - name: Set GitHub Pages project path
        working-directory: app
        run: |
          site_prefix="/${GITHUB_REPOSITORY#*/}/"
          find dist -type f -name '*.html' -exec sed -i "s#<base href=\"/\">#<base href=\"${site_prefix}\">#g" {} +
          sed -i "s#\"start_url\": \"/\"#\"start_url\": \"${site_prefix}\"#g" dist/manifest.json

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy-pages:
    name: Deploy web to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
