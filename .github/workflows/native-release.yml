name: Native release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version increment for the native release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    name: Select release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
            patch=0
          else
            version="${latest#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest tag is not a semantic version: $latest" >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          fi

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac

          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux release
    needs: version
    runs-on: ubuntu-latest
    env:
      EXACT2: ${{ github.workspace }}/exact
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out Exact
        uses: actions/checkout@v4
        with:
          repository: expo/exact
          path: exact

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Linux build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            app/target
            exact/target
          key: ${{ runner.os }}-linux-native-${{ hashFiles('app/**/Cargo.lock', 'exact/**/Cargo.lock', 'exact/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-linux-native-

      - name: Install Exact dependencies
        working-directory: exact
        run: bun install --no-frozen-lockfile

      - name: Prepare Exact toolchain
        working-directory: exact
        run: bun scripts/exact.mjs setup

      - name: Build Linux host
        working-directory: app
        run: bun exact.mjs linux

      - name: Package Linux artifact
        run: |
          mkdir -p app/release app/release-content
          find app/target/host-dev -maxdepth 1 -type f -executable -name '*-linux' -print -exec cp {} app/release-content/ \;
          find app/target/host-dev -maxdepth 1 -type f -name '*.desktop' -print -exec cp {} app/release-content/ \;
          test -n "$(find app/release-content -type f -name '*-linux' -print -quit)"
          tar -czf "app/release/expenses-linux-v${RELEASE_VERSION}.tar.gz" -C app/release-content .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: expenses-linux
          path: app/release/expenses-linux-*.tar.gz

  android:
    name: Build Android release
    needs: version
    runs-on: ubuntu-latest
    env:
      EXACT2: ${{ github.workspace }}/exact
    steps:
      - name: Check out app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out Exact
        uses: actions/checkout@v4
        with:
          repository: expo/exact
          path: exact

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Install Exact dependencies
        working-directory: exact
        run: bun install --no-frozen-lockfile

      - name: Prepare Exact toolchain
        working-directory: exact
        run: bun scripts/exact.mjs setup

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android --toolchain 1.97.0

      - name: Cache Android build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            app/target
            exact/target
          key: ${{ runner.os }}-android-native-${{ hashFiles('app/**/Cargo.lock', 'exact/**/Cargo.lock', 'exact/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-native-

      - name: Build Android APK
        working-directory: exact
        env:
          EXACT_APP_DIR: ${{ github.workspace }}/app
        run: bun scripts/agent-android.mjs build expenses --apk

      - name: Rename Android artifact
        run: mv app/target/android/app/outputs/apk/release/app-release.apk "app/expenses-android-v${{ needs.version.outputs.version }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: expenses-android
          path: app/expenses-android-*.apk

  release:
    name: Publish native release
    needs: [version, linux, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: expenses-linux
          path: release

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: expenses-android
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*
